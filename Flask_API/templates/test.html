<body>
    <script>
        async function postData(data, url="http://localhost:5000/api/users")
        {
            let init = {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data),
              };
            const response = await fetch(url, init);
            const result = response.json()
            console.log(result);
            return result;
        }


        async function getData(url="http://localhost:5000/api/users")
        {

            console.log(result);
            return result;
        }
