<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>test</title>
</head>
<body>
    <script>
        async function sendData(data)
        {
            let init = {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data),
              };
            const response = await fetch("http://127.0.0.1:5000/api/users", init);
            console.log(response.json());
            return response;
        };
        data = {name: "Julien", weight_kg: 70, height_m: 185, age: 17, sex: "M"};
        sendData(data);
    </script>
</body>
</html>
